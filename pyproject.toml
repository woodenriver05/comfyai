[project]
name = "comfyui-rag"
version = "1.0.0"
description = "AI 협업을 위한 ComfyUI 워크플로우 기억 시스템"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
